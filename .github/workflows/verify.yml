name: Verify Code

on:
  push:
    branches: ["*"]
    paths-ignore:
      - ".vscode/**"
      - "**/*.md"

  pull_request:
    branches: ["*"]
    paths-ignore:
      - ".vscode/**"
      - "**/*.md"

jobs:
  type-check:
    name: TypeScript Type Checking
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Type check
        run: pnpm typecheck

  lint:
    name: Linter Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Lint
        run: pnpm lint

  format:
    name: Formatter Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Check formatting
        run: pnpm format:check

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    needs: [type-check, lint, format]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Build
        run: pnpm build
      - name: Verify build artifacts
        run: |
          echo "🔍 Verifying build artifacts..."
          if [ -d ".next" ]; then
            echo "✅ Build artifacts found"
          else
            echo "❌ Build artifacts missing"
            exit 1
          fi
