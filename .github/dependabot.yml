# Dependabot uses the npm ecosystem for pnpm projects.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      next:
        patterns: ["next", "@next/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      radix:
        patterns: ["@radix-ui/*", "radix-ui"]
      eslint:
        patterns: ["eslint", "eslint-*", "@eslint/*", "typescript-eslint", "@typescript-eslint/*", "globals"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "tailwind", "tw-animate-css"]
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    # Next.js major upgrades require manual migration.
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
